<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#5b4bdb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mete Öğreniyor">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Mete Öğreniyor</title>
<style>
  :root{
    --mor:#5b4bdb; --mor-koyu:#4536b0; --sari:#ffcf3f; --pembe:#ff6fa5;
    --yesil:#3ec96b; --turkuaz:#2bc7d4; --turuncu:#ff9a3c; --kirmizi:#ff5c5c;
    --zemin:#fff7e6; --kart:#ffffff; --yazi:#2d2a4a; --golge:0 6px 0 rgba(0,0,0,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--zemin); color:var(--yazi);
    display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #app{flex:1;position:relative;overflow:hidden}
  .ekran{position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;animation:gir .3s ease}
  .ekran.aktif{display:flex}
  @keyframes gir{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
  @keyframes salla{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  @keyframes zipla{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

  .ust{display:flex;align-items:center;gap:10px;padding:14px 16px}
  .ust h1{font-size:20px;margin:0;flex:1}
  .yildiz-sayac{background:var(--sari);color:#5a4500;font-weight:800;border-radius:999px;padding:6px 14px;font-size:16px;box-shadow:var(--golge)}
  .btn-geri{background:var(--kart);border:none;border-radius:50%;width:46px;height:46px;font-size:22px;box-shadow:var(--golge);cursor:pointer}
  .btn-ikon{background:var(--kart);border:none;border-radius:50%;width:46px;height:46px;font-size:22px;box-shadow:var(--golge);cursor:pointer}

  /* Açılış */
  #s01{justify-content:center;align-items:center;text-align:center;background:linear-gradient(160deg,#6a5bff,#8b5bff)}
  #s01 .logo{font-size:84px;animation:zipla 2s ease-in-out infinite}
  #s01 h1{color:#fff;font-size:34px;margin:6px 0 4px}
  #s01 p{color:#ffe9a8;font-size:17px;margin:0 0 26px}
  .dil-sec{display:flex;gap:14px}
  .dil-btn{background:#fff;border:none;border-radius:22px;padding:16px 22px;font-size:17px;font-weight:800;box-shadow:var(--golge);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:120px}
  .dil-btn .bayrak{font-size:40px}
  .basla-btn{margin-top:24px;background:var(--sari);color:#5a4500;border:none;border-radius:999px;padding:18px 48px;font-size:22px;font-weight:900;box-shadow:0 6px 0 #d9a800;cursor:pointer}
  .basla-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #d9a800}

  /* Ana ekran konular */
  .konu-izgara{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:8px 16px 24px}
  .konu{border:none;border-radius:26px;padding:22px 12px;color:#fff;font-size:18px;font-weight:800;box-shadow:var(--golge);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:140px;justify-content:center}
  .konu:active{transform:translateY(4px)}
  .konu .emoji{font-size:54px}

  /* Aktivite listesi */
  .akt-liste{display:flex;flex-direction:column;gap:14px;padding:8px 16px 24px}
  .akt{background:var(--kart);border:none;border-radius:22px;padding:18px;display:flex;align-items:center;gap:16px;box-shadow:var(--golge);cursor:pointer;font-size:18px;font-weight:700;text-align:left}
  .akt:active{transform:translateY(3px)}
  .akt .emoji{font-size:40px}
  .akt .ad{flex:1}
  .akt .rozet{font-size:26px}

  /* Oyun alanı */
  .oyun{flex:1;display:flex;flex-direction:column;padding:8px 16px 20px}
  .soru{background:var(--kart);border-radius:26px;padding:22px;text-align:center;box-shadow:var(--golge);margin-bottom:16px}
  .soru .buyuk{font-size:72px;animation:pop .4s ease}
  .soru .metin{font-size:26px;font-weight:800;margin-top:8px}
  .soru .alt{font-size:18px;color:#8a86a8;margin-top:2px}
  .sec-btn{background:var(--kart);border:4px solid transparent;border-radius:24px;cursor:pointer;box-shadow:var(--golge);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;padding:14px;transition:border-color .15s}
  .sec-btn .em{font-size:52px}
  .sec-btn .lb{font-size:17px;font-weight:700}
  .sec-btn.dogru{border-color:var(--yesil);animation:pop .3s}
  .sec-btn.yanlis{border-color:var(--kirmizi);animation:salla .3s}
  .secenekler{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1}
  .ses-btn{background:var(--turkuaz);color:#fff;border:none;border-radius:999px;padding:16px 26px;font-size:20px;font-weight:800;box-shadow:var(--golge);cursor:pointer;display:inline-flex;align-items:center;gap:10px;margin:0 auto}

  /* Hafıza */
  .hafiza-izgara{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;flex:1;align-content:center}
  .h-kart{aspect-ratio:1;border:none;border-radius:18px;background:var(--mor);font-size:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--golge)}
  .h-kart .on{color:#fff;font-weight:900;font-size:38px;opacity:.85}
  .h-kart .arka{display:none}
  .h-kart.acik,.h-kart.eslesti{animation:pop .3s}
  .h-kart.acik .on,.h-kart.eslesti .on{display:none}
  .h-kart.acik .arka,.h-kart.eslesti .arka{display:inline}
  .h-kart.acik{background:var(--kart)}
  .h-kart.eslesti{background:var(--yesil);opacity:.7}

  .ilerleme-bar{height:14px;background:#e7e1f5;border-radius:999px;overflow:hidden;margin:0 16px 10px}
  .ilerleme-dolu{height:100%;background:var(--yesil);width:0;transition:width .3s;border-radius:999px}

  /* Ödül */
  #s08{justify-content:center;align-items:center;text-align:center}
  #s08 .kutlama{font-size:96px;animation:zipla 1s ease-in-out infinite}
  #s08 h2{font-size:30px;margin:14px 0 2px}
  #s08 .kazandin{font-size:40px;color:var(--sari);text-shadow:0 2px 0 #d9a800;font-weight:900;margin:6px 0 20px}
  .devam-btn{background:var(--yesil);color:#fff;border:none;border-radius:999px;padding:16px 42px;font-size:20px;font-weight:900;box-shadow:0 6px 0 #2a9b50;cursor:pointer}
  .devam-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #2a9b50}

  /* Ebeveyn */
  #s09 .ic{padding:0 16px 24px}
  .kilit-kutu{background:var(--kart);border-radius:22px;padding:22px;text-align:center;box-shadow:var(--golge);margin:0 16px}
  .kilit-kutu .soru-m{font-size:26px;font-weight:800;margin:10px 0 16px}
  .kilit-giris{font-size:28px;text-align:center;width:120px;padding:10px;border:3px solid var(--mor);border-radius:16px;margin-bottom:14px}
  .panel-kart{background:var(--kart);border-radius:20px;padding:18px;box-shadow:var(--golge);margin-bottom:14px}
  .panel-kart h3{margin:0 0 12px;font-size:18px}
  .satir{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0edf7;font-size:16px}
  .satir:last-child{border:none}
  .anahtar{display:flex;gap:8px}
  .anahtar button{border:none;border-radius:14px;padding:10px 16px;font-weight:800;cursor:pointer;font-size:15px;background:#eee;color:#777}
  .anahtar button.secili{background:var(--mor);color:#fff}
  .konfeti{position:fixed;top:-20px;font-size:26px;pointer-events:none;animation:dus linear forwards;z-index:50}
  @keyframes dus{to{transform:translateY(110vh) rotate(360deg);opacity:.3}}
  .ipuc{text-align:center;color:#9a95b5;font-size:14px;padding:10px 24px}
</style>
</head>
<body>
<div id="app">

  <!-- S01 Açılış -->
  <section id="s01" class="ekran aktif">
    <div class="logo">🦉</div>
    <h1 id="s01-baslik">Mete Öğreniyor</h1>
    <p id="s01-alt">Oynayarak öğren!</p>
    <div class="dil-sec">
      <button class="dil-btn" onclick="dilSec('tr')"><span class="bayrak">🇹🇷</span><span>Türkçe</span></button>
      <button class="dil-btn" onclick="dilSec('en')"><span class="bayrak">🇬🇧</span><span>English</span></button>
      <button class="dil-btn" onclick="dilSec('ikisi')"><span class="bayrak">🌍</span><span id="s01-ikisi">İkisi birden</span></button>
    </div>
    <button class="basla-btn" onclick="goster('s02')" id="s01-basla">Başla ▶</button>
  </section>

  <!-- S02 Ana ekran -->
  <section id="s02" class="ekran">
    <div class="ust">
      <h1 id="s02-selam">Merhaba Mete! 👋</h1>
      <div class="yildiz-sayac">⭐ <span id="yildiz-toplam">0</span></div>
      <button class="btn-ikon" onclick="ebeveynAc()" title="Ebeveyn">🔒</button>
    </div>
    <div class="konu-izgara" id="konu-izgara"></div>
    <p class="ipuc" id="s02-ipuc">Bir konuya dokun ve oynamaya başla</p>
  </section>

  <!-- S03 Aktivite listesi -->
  <section id="s03" class="ekran">
    <div class="ust">
      <button class="btn-geri" onclick="goster('s02')">←</button>
      <h1 id="s03-baslik">Konu</h1>
      <div class="yildiz-sayac">⭐ <span class="yildiz-toplam2">0</span></div>
    </div>
    <div class="akt-liste" id="akt-liste"></div>
  </section>

  <!-- S04-S07 Oyun -->
  <section id="s04" class="ekran">
    <div class="ust">
      <button class="btn-geri" onclick="oyundanCik()">←</button>
      <h1 id="oyun-baslik">Oyun</h1>
      <div class="yildiz-sayac">⭐ <span class="yildiz-toplam3">0</span></div>
    </div>
    <div class="ilerleme-bar"><div class="ilerleme-dolu" id="ilerleme-dolu"></div></div>
    <div class="oyun" id="oyun-alan"></div>
  </section>

  <!-- S08 Ödül -->
  <section id="s08" class="ekran">
    <div class="kutlama">🎉</div>
    <h2 id="s08-tebrik">Tebrikler Mete!</h2>
    <div class="kazandin">⭐ +<span id="s08-kazanilan">3</span></div>
    <button class="devam-btn" onclick="goster('s03')" id="s08-devam">Devam et</button>
  </section>

  <!-- S09 Ebeveyn -->
  <section id="s09" class="ekran">
    <div class="ust">
      <button class="btn-geri" onclick="goster('s02')">←</button>
      <h1>Ebeveyn Paneli</h1>
    </div>
    <div class="ic" id="ebeveyn-ic"></div>
  </section>

</div>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
</html>
