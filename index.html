d #fff;background:#fff8e7;border-radius:32px;box-shadow:0 12px #2876a64a;padding:clamp(12px,3vw,24px);min-height:420px}.gamehead{display:flex;align-items:center;justify-content:space-between;gap:9px}.game h2{font-size:clamp(23px,4vw,38px);margin:10px 0;color:#1f6093}.instruction{font-weight:900;font-size:clamp(18px,3vw,26px);color:#2d6381;background:#e8f8ff;padding:12px 15px;border-radius:19px;margin:12px 0}.board{min-height:225px;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:13px;padding:10px 0 20px;touch-action:pan-y}.choice{background:#fff;border:4px solid #cde9ff;border-radius:24px;box-shadow:0 6px #a5d2eb;min-width:95px;min-height:100px;max-width:210px;flex:1 1 130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;color:#26577c;font-weight:900;font-size:17px;user-select:none;touch-action:manipulation}.choice .emoji{font-size:clamp(40px,7vw,67px);line-height:1.2}.choice.selected{background:#fff0a7;border-color:#ffb83e}.choice.done{opacity:.3;pointer-events:none}.choice.wrong{animation:shake .3s}.choice.correct{background:#c9f8d7;border-color:#4cc783}.wide{flex-basis:180px}.meter{height:16px;background:#d5eaf0;border:3px solid #fff;border-radius:99px;overflow:hidden;flex:1;max-width:260px}.meter>div{height:100%;background:linear-gradient(90deg,#6be27a,#ffcd48);transition:width .3s}.foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:15px}.msg{font-weight:900;color:#27856a;min-height:28px}.reward{font-size:64px;animation:pop .5s}.canvas{border:4px dashed #82c9ed;background:#fff;border-radius:25px;width:min(100%,600px);height:270px;touch-action:none;display:block;margin:auto}.swatches{display:flex;justify-content:center;gap:12px;margin:10px}.swatches button{width:44px;height:44px;border-radius:50%;border:4px solid white;box-shadow:0 2px 5px #0004}.path{font-size:55px;letter-spacing:12px;color:#b8d4dd;text-align:center}.tiny{font-size:13px;color:#547b93}.hidden{display:none!important}@keyframes pop{50%{transform:scale(1.25)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}@media(max-width:540px){.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{min-height:155px}.card .art{height:76px;font-size:53px}.card strong{font-size:15px}.choice{flex-basis:110px;min-width:90px;min-height:91px}.game{border-radius:22px}.pill{font-size:12px}}
</style><style>

</style></head><body><div id="app"><header><h1>🌈 Mete'nin Keşif Adası</h1><div class="pill" id="total">⭐ 0</div></header><div id="home"><div class="hero-banner" role="img" aria-label="Mete'nin rengarenk keşif adası"></div><div class="intro">🧭 Dokun, düşün, dene, keşfet! Her seferinde yeni bir macera.</div><div class="filters" id="filters"></div><div class="cards" id="cards"></div></div><section id="play" class="game hidden"><div class="gamehead"><button class="round" id="back">🏡 Oyunlar</button><div class="pill" id="level">1 / 5</div><button class="round" id="voice">🔊</button></div><h2 id="title"></h2><div class="instruction" id="instruction"></div><div class="board" id="board"></div><div class="foot"><div class="meter"><div id="bar"></div></div><button class="round" id="skip">🎲 Yeni soru</button><span class="msg" id="msg"></span></div></section><section id="flagworld" class="game hidden" aria-label="Dünya Bayrakları"></section></div>
<script>
const activities=[
['flags','Dünya Bayrakları','🌍','Keşif','249 ülke ve bölge, kazı kazan, eşleştirme','#ffcf74'],
['wash','Araba Yıkama','🚗','Motor','Köpükle, durula, parlat','#9fddff'],
['pet','Hayvan Bakımı','🐶','Sosyal','Dostunu besle ve tara','#ffdc9f'],
['pairs','Eşini Bul','🧩','Zihin','Aynı resimleri eşleştir','#c9a4ff'],
['memory','Hafıza Kartları','🧠','Zihin','Kartları hatırla','#ffb8c6'],
['patterns','Örüntü Dedektifi','🔍','Zihin','Eksik şekli bul','#ffd484'],
['odd','Farklı Olanı Bul','👀','Zihin','Dikkatli bak','#b6e8fc'],
['count','Sayı Avcısı','🔢','Zihin','Say ve seç','#ffdf84'],
['sequence','Sıraya Koy','🔄','Zihin','Küçükten büyüğe','#b9e8a2'],
['habitat','Hayvanın Evi','🦊','Keşif','Canlıları tanı','#bbf1bb'],
['shapes','Şekil Dedektifi','🔺','Zihin','Şekilleri tanı','#d6b7ff'],
['recycle','Geri Dönüşüm','♻️','Sorumluluk','Atıkları ayır','#b4edbc'],
['kindness','İyilik Kahramanı','💝','Sosyal','Yardım etmeyi öğren','#ffc1d5'],
['feelings','Duygu Dedektifi','😊','Sosyal','Duyguları tanı','#ffdeb5'],
['safety','Güvenli Seçim','🚦','Sosyal','Güvenli davran','#a7e2fb'],
['hygiene','Sağlıklı Alışkanlık','🧼','Sorumluluk','Sağlığını koru','#a7f0ee'],
['traffic','Trafik Kaşifi','🚗','Keşif','İşaretleri keşfet','#ffe19e'],
['colors','Renk Laboratuvarı','🎨','Keşif','Renkleri tanı','#f3c2fd'],
['rhythm','Ritim Orkestrası','🥁','Motor','Ritmi tekrar et','#ffcda8'],
['trace','Çizgi Macerası','✏️','Motor','Parmağınla çiz','#b6e4ff'],
['garden','Minik Bahçıvan','🌱','Sorumluluk','Bitkiyi büyüt','#b0f0b0'],
['build','Kule Mimarı','🏗️','Motor','Doğru sırayla inşa et','#ffe3ac'],
['food','Sağlıklı Tabak','🥦','Sorumluluk','Besinleri keşfet','#b9f1bd']
].map(([id,name,icon,cat,desc,color])=>({id,name,icon,cat,desc,color}));
const $=s=>document.querySelector(s),pick=a=>a[Math.random()*a.length|0],shuffle=a=>[...a].sort(()=>Math.random()-.5);
let current=null,round=0,points=0,muted=false,lock=false,selected=null,correctCount=0,answer=null,challenge=null;
let earned={};try{earned=JSON.parse(localStorage.getItem('meteDiscovery')||'{}')}catch(e){}
function save(){try{localStorage.setItem('meteDiscovery',JSON.stringify(earned))}catch(e){}}
function total(){$('#total').textContent='⭐ '+Object.values(earned).reduce((a,b)=>a+b,0)}
function say(t){if(muted||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';u.rate=.87;u.pitch=1.13;speechSynthesis.speak(u)}catch(e){}}
function tone(){if(muted)return;try{let c=new(window.AudioContext||window.webkitAudioContext)();[523,659,784].forEach((f,i)=>{let o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.001,c.currentTime+i*.09);g.gain.exponentialRampToValueAtTime(.08,c.currentTime+i*.09+.02);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+i*.09+.18);o.start(c.currentTime+i*.09);o.stop(c.currentTime+i*.09+.19)});setTimeout(()=>c.close(),800)}catch(e){}}
const cats=['Hepsi','Zihin','Sosyal','Sorumluluk','Motor','Keşif'];let filter='Hepsi';
function home(){total();$('#filters').innerHTML=cats.map(c=>`<button class="filter ${filter===c?'active':''}" data-c="${c}">${c}</button>`).join('');$('#cards').innerHTML=activities.filter(a=>filter==='Hepsi'||a.cat===filter).map(a=>`<button class="card" data-id="${a.id}"><div class="art" style="--c:${a.color}">${({wash:"<img src=\"assets/araba.webp\" alt=\"Araba\">",pet:"<img src=\"assets/hayvan.webp\" alt=\"Köpek\">",build:"<img src=\"assets/makine.webp\" alt=\"İş makinesi\">",food:"<img src=\"assets/mutfak.webp\" alt=\"Mutfak\">",safety:"<img src=\"assets/itfaiye.webp\" alt=\"İtfaiye\">"})[a.id]||a.icon}</div><strong>${a.name}</strong><small>${a.desc} ${earned[a.id]?' · ⭐'+earned[a.id]:''}</small></button>`).join('');document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.c;home()});document.querySelectorAll('.card').forEach(b=>b.onclick=()=>start(b.dataset.id))}
function start(id){if(id==='flags'){openFlags();return}current=activities.find(a=>a.id===id);round=0;points=0;$('#home').classList.add('hidden');$('#play').classList.remove('hidden');$('#title').textContent=current.icon+' '+current.name;render()}
function exit(){lock=false;current=null;$('#play').classList.add('hidden');$('#home').classList.remove('hidden');try{speechSynthesis.cancel()}catch(e){}home()}
function option(emoji,label,val,extra=''){return `<button class="choice ${extra}" data-val="${String(val).replaceAll('"','&quot;')}"><span class="emoji">${emoji}</span><span>${label||''}</span></button>`}
function render(){lock=false;selected=null;correctCount=0;$('#level').textContent=`${Math.min(round+1,5)} / 5`;$('#bar').style.width=`${round*20}%`;$('#msg').textContent='';const id=current.id,b=$('#board');b.innerHTML='';let q='',html='',handler=null;
const animals=[['🐶','Köpek'],['🐱','Kedi'],['🐰','Tavşan'],['🦁','Aslan'],['🐸','Kurbağa'],['🐼','Panda'],['🦊','Tilki'],['🐻','Ayı'],['🐵','Maymun'],['🐧','Penguen']];
if(id==='wash'||id==='pet'){q=id==='wash'?'Arabayı önce köpükle, sonra suyla durula, en son parlat!':'Sevimli dostumuza önce mama ver, sonra tara, sonra sev!';let steps=id==='wash'?[['🧽','Köpükle'],['🚿','Durula'],['✨','Parlat']]:[['🦴','Mama ver'],['🪮','Tara'],['💗','Sev']];let scene=id==='wash'?'assets/araba.webp':'assets/hayvan.webp';b.innerHTML=`<div class="scene"><img src="${scene}" alt="${id==='wash'?'Araba yıkama':'Hayvan bakımı'}"><div id="particles" class="particles"></div></div><div class="toolrow">${steps.map((x,i)=>`<button class="tool" data-step="${i}"><span>${x[0]}</span>${x[1]}</button>`).join('')}</div>`;$('#instruction').textContent=q;const p=$('#particles');b.querySelectorAll('.tool').forEach(btn=>btn.onclick=()=>{let i=Number(btn.dataset.step);if(i!==correctCount){wrong(btn);return}btn.classList.add('used');btn.disabled=true;correctCount++;p.innerHTML=Array.from({length:16},(_,j)=>`<span style="left:${Math.random()*88+6}%;top:${Math.random()*78+8}%;animation-delay:${j*.03}s">${id==='wash'?['🫧','💦','✨'][i]:['💛','🌟','💗'][i]}</span>`).join('');$('#msg').textContent=['Harika!','Çok güzel!','Başardın!'][i];tone();if(correctCount===3)setTimeout(success,500)});say(q);return}
else if(id==='pairs'||id==='memory'){let n=id==='memory'?4:3,items=shuffle(animals).slice(0,n),cards=shuffle([...items,...items]);q=id==='memory'?'İki aynı hayvanı bul!':'Aynı hayvanları eşleştir!';html=cards.map((a,i)=>option(id==='memory'?'❔':a[0],id==='memory'?'':a[1],i)).join('');let first=null,matched=new Set;handler=(v,el)=>{if(matched.has(+v)||lock||el===first?.el)return;if(id==='memory'){el.querySelector('.emoji').textContent=cards[v][0];el.lastElementChild.textContent=cards[v][1]}if(!first){first={v:+v,el};el.classList.add('selected');return}if(cards[v][1]===cards[first.v][1]){matched.add(+v);matched.add(first.v);el.classList.add('done');first.el.classList.add('done');first=null;correctCount++;tone();if(correctCount===n)success()}else{lock=true;el.classList.add('wrong');first.el.classList.add('wrong');let prev=first;first=null;setTimeout(()=>{[el,prev.el].forEach(x=>{x.classList.remove('wrong','selected');if(id==='memory'){x.querySelector('.emoji').textContent='❔';x.lastElementChild.textContent=''}});lock=false},650)}}}
else if(id==='patterns'){let sets=[['🔴','🔵'],['🐱','🐶'],['⭐','🌙'],['🍎','🍌'],['🟨','🟩']];let p=pick(sets),next=p[round%2];q=`Sıradaki hangisi? ${p[0]} ${p[1]} ${p[0]} ${p[1]} ❓`;html=shuffle(p).map(x=>option(x,'',x)).join('');answer=next;handler=basic}
else if(id==='odd'){let items=shuffle(animals).slice(0,2),odd=round%2?items[0]:items[1],same=odd===items[0]?items[1]:items[0];q='Hangisi diğerlerinden farklı?';html=shuffle([same,same,same,odd]).map((a,i)=>option(a[0],a[1],a[1])).join('');answer=odd[1];handler=basic}
else if(id==='count'){let n=2+Math.random()*6|0,e=pick(['🍎','⭐','🐟','🌸','🚗']);q=`Kaç tane var? ${e.repeat(n)}`;answer=String(n);html=shuffle([n,n+1,Math.max(1,n-1),n+2]).map(x=>option('🔢',String(x),String(x))).join('');handler=basic}
else if(id==='sequence'||id==='build'){let arr=id==='build'?[['🧱','Temel'],['🏠','Duvar'],['🏡','Çatı']]:[['🌱','Tohum'],['🌿','Fidan'],['🌳','Ağaç']];q=id==='build'?'Evi hangi sırayla yaparız?':'Bitki nasıl büyür? Doğru sırayla dokun.';html=shuffle(arr).map(a=>option(a[0],a[1],a[1])).join('');handler=(v,el)=>{if(v===arr[correctCount][1]){el.classList.add('done');correctCount++;tone();if(correctCount===arr.length)success()}else wrong(el)}}

function flagEmoji(code){return [...code].map(ch=>String.fromCodePoint(127397+ch.charCodeAt(0))).join('')}
function randomCountry(){return WORLD_COUNTRIES[Math.random()*WORLD_COUNTRIES.length|0]}
function flagSpeak(lang){if(!flagCountry)return;let text=lang==='tr'?flagCountry.tr:flagCountry.en;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang=lang==='tr'?'tr-TR':'en-US';u.rate=.75;speechSynthesis.speak(u)}catch(e){}}
function flagShell(){return `<div class="gamehead"><button class="round" id="flagBack">🏡 Oyunlar</button><div class="pill">🌍 249 ülke / bölge</div><div class="pill">⭐ <span id="flagStars">${flagHits}</span></div></div><h2>🌍 Dünya Bayrakları · World Flags</h2><div class="flag-tabs">${[['scratch','🪙 Kazı Kazan'],['match','🧩 Eşleştirme'],['quiz','🚩 Hangi Bayrak?'],['collection','📚 Bayrak Albümü']].map(([id,label])=>`<button data-mode="${id}" class="${flagMode===id?'on':''}">${label}</button>`).join('')}</div><div class="flagpanel" id="flagPanel"></div>`}
function openFlags(){try{speechSynthesis.cancel()}catch(e){}$('#home').classList.add('hidden');$('#play').classList.add('hidden');$('#flagworld').classList.remove('hidden');flagRound=0;flagHits=0;flagMode='scratch';renderFlags()}
function leaveFlags(){$('#flagworld').classList.add('hidden');$('#home').classList.remove('hidden');home()}
function renderFlags(){let w=$('#flagworld');w.innerHTML=flagShell();$('#flagBack').onclick=leaveFlags;w.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{flagMode=b.dataset.mode;flagRound=0;renderFlags()});if(flagMode==='scratch')scratchFlag();else if(flagMode==='quiz')quizFlag();else if(flagMode==='match')matchFlags();else collectionFlags()}
function rewardFlag(){flagHits++;$('#flagStars').textContent=flagHits;earned.flags=(earned.flags||0)+1;save();total();tone()}
function names(c){return `<div class="flagname">${c.tr}</div><div class="flagen">${c.en}</div><div class="flagbuttons"><button id="speakTr">🔊 Türkçe</button><button id="speakEn">🔊 English</button></div>`}
function bindNames(){let t=$('#speakTr'),e=$('#speakEn');if(t)t.onclick=()=>flagSpeak('tr');if(e)e.onclick=()=>flagSpeak('en')}
function scratchFlag(){flagCountry=randomCountry();let p=$('#flagPanel');p.innerHTML=`<div class="instruction">🪙 Parmağınla gri alanı kazı, bayrağı keşfet!</div><div class="scratchwrap"><div class="scratchunder"><div class="flagbig">${flagEmoji(flagCountry.code)}</div></div><canvas id="scratchCanvas"></canvas></div><div id="scratchResult"><div class="tiny">Bayrağı görmek için kazımaya başla.</div></div><button class="flagnext" id="flagNext">➡️ Başka bayrak</button>`;$('#flagNext').onclick=scratchFlag;
let c=$('#scratchCanvas'),r=c.getBoundingClientRect(),ratio=window.devicePixelRatio||1;c.width=r.width*ratio;c.height=r.height*ratio;let ctx=c.getContext('2d');ctx.scale(ratio,ratio);ctx.fillStyle='#b6c0c9';ctx.fillRect(0,0,r.width,r.height);ctx.fillStyle='#e8eff3';ctx.font='bold 27px system-ui';ctx.textAlign='center';ctx.fillText('🪙 KAZI KAZAN!',r.width/2,r.height/2);ctx.globalCompositeOperation='destination-out';let drawing=false,moves=0,revealed=false;
function reveal(){if(revealed)return;revealed=true;ctx.clearRect(0,0,r.width,r.height);$('#scratchResult').innerHTML=names(flagCountry);bindNames();rewardFlag();flagSpeak('tr')}
function move(e){if(!drawing)return;let b=c.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;ctx.beginPath();ctx.arc(x,y,27,0,Math.PI*2);ctx.fill();moves++;if(moves>45)reveal()}
c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);move(e)};c.onpointermove=move;c.onpointerup=()=>{drawing=false};c.onpointercancel=()=>drawing=false;
}
function quizFlag(){flagCountry=randomCountry();let opts=shuffle([flagCountry,...shuffle(WORLD_COUNTRIES.filter(c=>c.code!==flagCountry.code)).slice(0,3)]);let p=$('#flagPanel');p.innerHTML=`<div class="instruction">🚩 Bu hangi ülkenin bayrağı? / Which country's flag?</div><div class="flagbig">${flagEmoji(flagCountry.code)}</div><div class="flagchoices">${opts.map(c=>`<button class="flagchoice" data-code="${c.code}">${c.tr}<small style="display:block">${c.en}</small></button>`).join('')}</div><div id="flagFeedback"></div><button class="flagnext" id="quizNext">➡️ Yeni soru</button>`;$('#quizNext').onclick=quizFlag;p.querySelectorAll('[data-code]').forEach(b=>b.onclick=()=>{if(b.dataset.code===flagCountry.code){if(!p.dataset.answered){rewardFlag();p.dataset.answered='yes'}b.classList.add('good');$('#flagFeedback').innerHTML=names(flagCountry);bindNames();flagSpeak('tr')}else{b.classList.add('bad');$('#flagFeedback').textContent='💡 Tekrar dene!'}})}
function matchFlags(){flagSet=shuffle(WORLD_COUNTRIES).slice(0,4);flagMatches=0;let left=shuffle(flagSet),right=shuffle(flagSet);let p=$('#flagPanel');p.innerHTML=`<div class="instruction">🧩 Bayrağa dokun, sonra doğru ülke adını seç!</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div id="matchLeft">${left.map(c=>`<button class="flagchoice" style="display:block;width:100%;margin-bottom:9px" data-flag="${c.code}"><span class="femoji">${flagEmoji(c.code)}</span></button>`).join('')}</div><div id="matchRight">${right.map(c=>`<button class="flagchoice" style="display:block;width:100%;margin-bottom:9px" data-name="${c.code}">${c.tr}<small style="display:block">${c.en}</small></button>`).join('')}</div></div><div id="matchFeedback" class="msg"></div><button class="flagnext" id="matchNext">🔄 Yeni eşleştirme</button>`;$('#matchNext').onclick=matchFlags;let selected=null;
p.querySelectorAll('[data-flag]').forEach(b=>b.onclick=()=>{if(b.disabled)return;p.querySelectorAll('[data-flag]').forEach(x=>x.classList.remove('good'));selected=b.dataset.flag;b.classList.add('good');flagCountry=flagSet.find(c=>c.code===selected);flagSpeak('tr')});
p.querySelectorAll('[data-name]').forEach(b=>b.onclick=()=>{if(!selected){$('#matchFeedback').textContent='Önce bir bayrak seç!';return}if(selected===b.dataset.name){p.querySelector(`[data-flag="${selected}"]`).disabled=true;p.querySelector(`[data-flag="${selected}"]`).style.opacity='.3';b.disabled=true;b.classList.add('good');b.style.opacity='.5';selected=null;flagMatches++;rewardFlag();$('#matchFeedback').textContent='🌟 Harika! '+flagMatches+'/4';if(flagMatches===4)$('#matchFeedback').textContent='🏆 Tüm bayrakları eşleştirdin!'}else{$('#matchFeedback').textContent='💡 Bir daha dene!';b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),450)}})}
function collectionFlags(){let p=$('#flagPanel');p.innerHTML=`<div class="instruction">📚 Dünya Bayrakları Albümü · Türkçe ve İngilizce isimleri dinle!</div><input class="flagsearch" id="flagSearch" placeholder="🔎 Ülke ara / Search country" value="${flagFilter.replaceAll('"','&quot;')}"><div class="tiny">249 ülke ve bölge · ISO 3166-1 listesi</div><div id="flagList"></div><div class="flagbuttons"><button id="prevFlags">⬅️ Önceki</button><span id="pageNum"></span><button id="nextFlags">Sonraki ➡️</button></div><div id="flagDetail"></div>`;$('#flagSearch').oninput=e=>{flagFilter=e.target.value;flagPage=0;listFlags()};$('#prevFlags').onclick=()=>{flagPage=Math.max(0,flagPage-1);listFlags()};$('#nextFlags').onclick=()=>{flagPage++;listFlags()};listFlags()}
function listFlags(){let all=WORLD_COUNTRIES.filter(c=>(c.tr+' '+c.en).toLocaleLowerCase('tr').includes(flagFilter.toLocaleLowerCase('tr'))),pages=Math.max(1,Math.ceil(all.length/24));flagPage=Math.min(flagPage,pages-1);$('#pageNum').textContent=(flagPage+1)+' / '+pages;$('#flagList').innerHTML=`<div class="flagcollection">${all.slice(flagPage*24,flagPage*24+24).map(c=>`<button class="flagtile" data-country="${c.code}"><span class="femoji">${flagEmoji(c.code)}</span>${c.tr}<small>${c.en}</small></button>`).join('')}</div>`;$('#flagList').querySelectorAll('[data-country]').forEach(b=>b.onclick=()=>{flagCountry=WORLD_COUNTRIES.find(c=>c.code===b.dataset.country);$('#flagDetail').innerHTML=`<div class="flagbig">${flagEmoji(flagCountry.code)}</div>${names(flagCountry)}`;bindNames();flagSpeak('tr')})}
</script></body></html>
